name: Bug report
description: Report a reproducible non-security problem using synthetic data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not post vulnerabilities or private data here. Read SECURITY.md for private reporting guidance."
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe to share
      options:
        - label: "This report contains no vulnerability details, secrets, personal records, or real chart uploads."
          required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Include the commit SHA and affected page or module.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic records and include expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, and relevant runtime versions. Do not paste environment variables or database connection strings.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Optional screenshots or short logs. Remove personal information, tokens, paths with usernames, and credentials.
